name: Deploy T3 Sandbox

on:
  workflow_dispatch:
    inputs:
      exe_token:
        description: 'Your exe.dev API Key'
        required: true
        type: string
      vm_name:
        description: 'VM Name'
        required: false
        default: 't3-sandbox'
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Spin up VM on exe.dev
        env:
          EXE_TOKEN: ${{ inputs.exe_token }}
          VM_NAME: ${{ inputs.vm_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          SETUP_URL="https://raw.githubusercontent.com/${REPO}/main/setup.sh"

          echo "🚀 Provisioning ${VM_NAME} on exe.dev..."
          curl -s -f -X POST https://exe.dev/exec \
            -H "Authorization: Bearer ${EXE_TOKEN}" \
            -H "Content-Type: text/plain" \
            -d "new --name=${VM_NAME} --setup-script=\"curl -fsSL ${SETUP_URL} | bash\" --json"

          echo "🔗 Attaching tailscale-wif integration..."
          curl -s -f -X POST https://exe.dev/exec \
            -H "Authorization: Bearer ${EXE_TOKEN}" \
            -H "Content-Type: text/plain" \
            -d "integrations attach tailscale-wif vm:${VM_NAME} --json" || true

          echo "================================================="
          echo "✅ Sandbox Deployment Initiated!"
          echo "Access your environment at: https://${VM_NAME}.exe.xyz"
          echo "================================================="
          
          # Write summary to GitHub UI
          echo "### 🚀 Sandbox Created!" >> $GITHUB_STEP_SUMMARY
          echo "- **VM Name:** \`${VM_NAME}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Workspace URL:** [https://${VM_NAME}.exe.xyz](https://${VM_NAME}.exe.xyz)" >> $GITHUB_STEP_SUMMARY
      - name: Fetch Pairing Link & Output Summary
        env:
          EXE_TOKEN: ${{ inputs.exe_token }}
          VM_NAME: ${{ inputs.vm_name }}
        run: |
          echo "⏳ Waiting for VM setup and T3 Code to boot..."
          
          PAIR_TOKEN=""
          # Poll every 10 seconds for up to 3 minutes
          for i in {1..18}; do
            RESPONSE=$(curl -s -X POST https://exe.dev/exec \
              -H "Authorization: Bearer ${EXE_TOKEN}" \
              -H "Content-Type: text/plain" \
              -d "exec vm:${VM_NAME} \"t3 auth pairing create --ttl 7d --json\"" 2>/dev/null || true)
            
            PAIR_TOKEN=$(echo "$RESPONSE" | jq -r '.credential // .token // empty' 2>/dev/null || true)
            
            if [ -n "$PAIR_TOKEN" ]; then
              echo "✅ T3 Code is running and pairing token acquired!"
              break
            fi
            
            echo "Still installing packages on VM... ($((i * 10))s elapsed)"
            sleep 10
          done

          if [ -z "$PAIR_TOKEN" ]; then
            echo "❌ Setup timed out. Please check VM logs."
            exit 1
          fi

          PAIR_URL="https://${VM_NAME}.exe.xyz/pair#token=${PAIR_TOKEN}"

          echo "================================================="
          echo "🚀 Workspace Ready!"
          echo "Direct Launch URL: ${PAIR_URL}"
          echo "================================================="

          # Write clickable 1-click link to GitHub Summary
          echo "### 🚀 Sandbox Ready!" >> $GITHUB_STEP_SUMMARY
          echo "[👉 Click here to Open Pre-Paired T3 Code Workspace](${PAIR_URL})" >> $GITHUB_STEP_SUMMARY
